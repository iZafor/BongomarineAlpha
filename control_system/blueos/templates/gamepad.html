<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>SAUVC BONGOMARINE CONTROLLER</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/static/style/bootstrap.css" />
        <link rel="stylesheet" href="/static/styles.css" />
        <link rel="stylesheet" href="/static/style/sweetalert2.css" />
        <script src="/static/js/sweetalert2.js"></script>
    </head>
    <body>
        <div class="container">
            <h2 class="center">SAUVC BONGOMARINE CONTROLLER</h2>
            <div class="status-panel">
                <img
                    src="/video_feed"
                    class="img-fluid"
                    alt="Video Feed"
                    width="800"
                />
                <div id="record">
                    <button id="start" class="btn btn-success">
                        Start Recording
                    </button>
                    <button id="stop" class="btn btn-warning">
                        Stop Recording
                    </button>
                </div>
                <strong
                    ><span id="recording-status" class="text-danger"></span
                ></strong>
            </div>
            <div class="gamepad">
                <button type="button" class="btn btn-primary" id="l">
                    Left
                </button>
                <button type="button" class="btn btn-primary" id="u">Up</button>
                <button type="button" class="btn btn-primary" id="f">
                    Forward
                </button>
                <button type="button" class="btn btn-primary" id="r">
                    Right
                </button>
                <button type="button" class="btn btn-primary" id="b">
                    Back
                </button>
                <button type="button" class="btn btn-primary" id="d">
                    Down
                </button>
                <button type="button" class="btn btn-danger" id="s">
                    All Stop
                </button>
            </div>
            <div class="note-panel center">
                <p>
                    <strong><u>Keyboard Controls</u></strong>
                </p>
                <ul align="left">
                    <li>Forward: Arrow Up or W</li>
                    <li>Backward: Arrow Down or S</li>
                    <li>Left: Arrow Left or A</li>
                    <li>Right: Arrow Right or D</li>
                    <li>Upward: Shift</li>
                    <li>Downward: Space</li>
                    <li>ALL OFF: F</li>
                    <li>Recording Start: R</li>
                    <li>Recording Stop: T</li>
                </ul>
            </div>
        </div>

        <script>
            function showAlertDialog(status, title, text) {
                if (status) {
                    icon = "success";
                } else {
                    icon = "error";
                }

                Swal.fire({
                    icon: icon,
                    title: title,
                    text: text,
                    toast: true,
                    position: "top-end",
                    showConfirmButton: false,
                    timer: 3000,
                });
            }

            function sendDirection(direction) {
                fetch("/control", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({direction}),
                })
                    .then((response) => {
                        if (response.ok) {
                            response.json().then((data) => {
                                if (data.error) {
                                    showAlertDialog(
                                        false,
                                        "Response Warning",
                                        data.error,
                                    );
                                }
                            });                            
                        } else {
                            showAlertDialog(
                                false,
                                "Response Warning",
                                "Invalid response from server!",
                            )
                        }
                    })
                    .catch((error) => {
                        showAlertDialog(
                            false,
                            "Connection Warning",
                            "Failed to send direction!"
                        )
                        console.error("Error:", error)
                    });
            }

            document.addEventListener("DOMContentLoaded", () => {
                <!-- show control system status -->
                const control_system_status = {{ control_system_status | tojson }};
                if (control_system_status) {
                    showAlertDialog(
                        control_system_status,
                        "System Operational",
                        "The control system is running smoothly!"
                    );

                    const gpio_status = {{ gpio_status | tojson }};
                    setTimeout(() => {
                        if (!gpio_status) {
                            showAlertDialog(
                                gpio_status,
                                "GPIO Warning",
                                "There might be an issue with the GPIO pins."
                            );
                        }
                    }, 3000);

                    const bar_status = {{ bar_status | tojson }};
                    setTimeout(() => {
                        if (!bar_status) {
                                showAlertDialog(
                                    bar_status,
                                    "Barometer Warning",
                                    "There might be an issue with the barometer."
                                );
                        }
                    }, !gpio_status ? 6000 : 3000)
                } else {
                    showAlertDialog(
                        control_system_status,
                        "System Warning",
                        "There might be an issue with the control system."
                    );
                }

                const recordingStatus =
                    document.getElementById("recording-status");

                <!-- setup button click events -->
                document.querySelectorAll("button").forEach((b) =>
                    b.addEventListener("click", async (event) => {
                        const direction = event.target.id;
                        await sendDirection(direction);
                        if (direction === "start") {
                            recordingStatus.innerText = "🔴 Recording is ON 🔴";
                        } else if (direction === "stop") {
                            recordingStatus.innerText = "Recording is OFF";
                        }
                    })
                );

                document.addEventListener("keydown", (event) => {
                    switch (event.key) {
                        case "ArrowUp":
                        case "w":
                            sendDirection("f");
                            break;
                        case "ArrowDown":
                        case "s":
                            sendDirection("b");
                            break;
                        case "ArrowLeft":
                        case "a":
                            sendDirection("l");
                            break;
                        case "ArrowRight":
                        case "d":
                            sendDirection("r");
                            break;
                        case "i":
                            sendDirection("u");
                            break;
                        case "k":
                            sendDirection("d");
                            break;
                        case "f":
                            sendDirection("s");
                            break;
                        case "p":
                            sendDirection("p");
                            break;
                        case "o":
                            sendDirection("o");
                            break;
                        case "r":
                            sendDirection("start");
                            recordingStatus.innerText = "🔴 Recording is ON 🔴";
                            break;
                        case "t":
                            sendDirection("stop");
                            recordingStatus.innerText = "Recording is OFF";
                            break;
                    }
                });
            });
        </script>
    </body>
</html>
